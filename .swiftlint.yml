included:
  - src

excluded:
  - .build
  - Vendor

disabled_rules:
  # Matches swift-format config (NeverForceUnwrap/NeverUseForceTry/NeverUseImplicitlyUnwrappedOptionals: false)
  - force_cast
  - force_try
  - force_unwrapping
  - todo
  # Conflicts with swift-format: it requires trailing commas (multiElementCollectionTrailingCommas: true)
  - trailing_comma
  # Conflicts with swift-format: redundant, and swift-format formats multiline declarations differently
  - opening_brace
  - closure_parameter_position
  # swift-format enforces 100-char lines on real code; long lines in embedded string literals are intentional
  - line_length
  # Intentional design: DraculaTheme factory (14 params, ported verbatim for appearance parity)
  - function_parameter_count
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - weak_delegate
  - first_where
  - last_where
  - redundant_nil_coalescing
  - contains_over_filter_count
  - explicit_init
  - closure_spacing

# Tightened thresholds for the rewrite (master plan "Tightened standards"). The
# god-objects that needed `swiftlint:disable file_length/cyclomatic/function_body`
# are gone; new code must hold these without suppressions.
file_length:
  warning: 400
  error: 800

cyclomatic_complexity:
  warning: 8
  error: 12

function_body_length:
  warning: 50
  error: 120

type_body_length:
  warning: 250
  error: 400

identifier_name:
  excluded:
    - id          # standard Identifiable protocol property
    - up          # conventional enum case name
    - x           # conventional coordinate variable
    - y
